<!DOCTYPE html>
<html>
<head>
<title>Car Washing Center</title>
<style>
body{
  font-family:Arial;
  background:#f4f4f4;
}
.container{
  width:400px;
  margin:auto;
  background:white;
  padding:20px;
  margin-top:30px;
  border-radius:10px;
  box-shadow:0 0 10px gray;
}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}
table{
  width:90%;
  margin:auto;
  margin-top:30px;
  border-collapse:collapse;
}
td,th{
  border:1px solid black;
  padding:8px;
}
</style>
</head>

<body>

<div class="container">
<h2>🚗 Car Wash Entry</h2>

<form id="form">
<input type="text" name="name" placeholder="Customer Name" required>
<input type="text" name="phone" placeholder="Phone" required>
<input type="text" name="car" placeholder="Car Number" required>

<select name="type">
<option>Car</option>
<option>Bike</option>
<option>SUV</option>
</select>

<select name="service">
<option>Wash</option>
<option>Full Service</option>
<option>Polish</option>
</select>

<input type="number" name="price" placeholder="Price" required>

<button type="submit">Save Booking</button>
</form>
</div>

<table id="dataTable">
<tr>
<th>Name</th>
<th>Phone</th>
<th>Car</th>
<th>Service</th>
<th>Price</th>
</tr>
</table>

<script>
const scriptURL = "YOUR_GOOGLE_SCRIPT_URL";

const form = document.getElementById("form");

form.addEventListener("submit", e=>{
  e.preventDefault();

  const data = new FormData(form);

  fetch(scriptURL,{
    method:"POST",
    body:data
  })
  .then(res=>res.text())
  .then(()=>{
    alert("Saved Successfully!");
    form.reset();
  })
});
</script>

</body>
</html>
